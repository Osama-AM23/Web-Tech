<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Main Page</title>
    <link rel="icon" href="https://cdn.olaelectric.com/ev-discovery-platform/New-Homepage/ola_black_logo.svg"
        type="image/png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --main-color: #5c899d;
            --bg-color: #fffcef;
            --text-color: #2e4a56;
            --button-hover: #4a7388;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--main-color);
            padding: 12px 20px;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        header img {
            height: 40px;
            width: auto;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 120px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 200px;
            padding: 12px 20px;
            border-radius: 30px;
            background: var(--main-color);
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease-in-out;
            position: relative;
            overflow: hidden;
        }

        .btn-link i {
            margin-right: 10px;
            font-size: 22px;
        }

        .btn-link:hover {
            background: var(--button-hover);
            box-shadow: 0 0 20px var(--button-hover);
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        .btn-link:hover i {
            animation: bounce 0.5s ease-in-out;
        }

        .bottom-right-img {
            position: fixed;
            bottom: 10px;
            right: 0px;
            width: 500px;
            height: auto;
        }
    </style>
</head>

<body>

    <header>
        <img src="https://cdn.olaelectric.com/ev-discovery-platform/New-Homepage/ola_black_logo.svg" alt="OLA Electric">
    </header>

    <img class="bottom-right-img" src="https://i.ibb.co/TMf6Mkrh/home-experience-center-bg-v2-Photoroom.png" alt="Experience Center">
    
    <div class="container">
        <a href="addShowRoom" class="btn-link">
            <i class="bi bi-plus-circle-fill"></i> Add Showroom
        </a>
        <a href="addBikeDetails" class="btn-link">
            <i class="bi bi-plus-circle-fill"></i> Add Bike Info
        </a>
        <a href="getDetails" class="btn-link">
            <i class="bi bi-plus-circle-fill"></i> Assign Bike For Showroom
        </a>
    </div>

</body>

</html>
