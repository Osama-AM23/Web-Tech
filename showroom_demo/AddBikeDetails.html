<%@ page isELIgnored = "false"%>
<%@ taglib prefix="c" uri="http://java.sun.com/jsp/jstl/core" %>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add bike</title>
    <link rel="icon" href="https://cdn.olaelectric.com/ev-discovery-platform/New-Homepage/ola_black_logo.svg"
        type="image/png" />
    <style>
        :root {
            --main-color: #5c899d;
            --bg-color: #fffcef;
            --text-color: #2e4a56;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--main-color);
            padding: 8px 15px;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        header img {
            height: 35px;
            width: auto;
        }

        .container {
            background: var(--main-color);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container h3 {
            color: white;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .container input,
        .container select {
            width: 100%;
            height: 45px;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: white;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
            transition: background 0.3s ease-in-out;
            box-sizing: border-box;
        }

        .container select {
            cursor: pointer;
        }

        .container input:focus,
        .container select:focus {
            background: var(--bg-color);
        }

        .container input[type="submit"] {
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            width: 100%;
            box-shadow: 0 0 5px var(--bg-color);
            height: 45px;
        }

        .container input[type="submit"]:hover {
            box-shadow: 0 0 15px var(--bg-color);
            transform: scale(1.05);
        }

        #rangeError {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color: red;
            font-size: 7px;
            font-weight: bold;
            display: block;
            margin-top: 2px;
            padding: 3px 8px;
            border-radius: 5px;
            text-align: left;
            width: 100%;
        }

        #priceError {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color: red;
            font-size: 7px;
            font-weight: bold;
            display: block;
            margin-top: 2px;
            padding: 3px 8px;
            border-radius: 5px;
            text-align: left;
            width: 100%;
        }
    </style>
</head>

<body>
    <header>
        <img src="https://cdn.olaelectric.com/ev-discovery-platform/New-Homepage/ola_black_logo.svg" alt="OLA Electric">
    </header>

    <div class="container">
        <form id="bikeForm" action="addBikeDetails" method="post">
            <h3>ADD Bike Details</h3>
            <select name="bikeName" id="dropdown">
                <option value="" disabled selected>Select Bike</option>
                <c:forEach items="${bike}" var="bike">
                    <option value="${bike.name()}">${bike.name()}</option>
                </c:forEach>
            </select>

            <select name="version" id="dropdown">
                <option value="" disabled selected>Select Version</option>
                <c:forEach items="${version}" var="version">
                    <option value="${version.name()}">${version.name()}</option>
                </c:forEach>
            </select>

            <select name="bikeRange" id="dropdown">
              <option value="" disabled selected>Select Range/Meilage</option>
                  <c:forEach items="${range}" var="range">
                     <option value="${range.name()}">${range.name()}</option>
                  </c:forEach>
            </select>

            <select name="motorPower" id="dropdown">
                <option value="" disabled selected>Select motorPower</option>
                <c:forEach items="${motorPower}" var="motorPower">
                    <option value="${motorPower.name()}">${motorPower.name()}</option>
                </c:forEach>
            </select>

           <input type="text" onchange="onPrice()" id= "price" name="price" placeholder="Enter Bike Price"/>
           <span id="priceError" style="color: red;"></span>
            <input type="submit" id="submitBtn" value="Register Details">
        </form>
    </div>
    <script>
                    function onPrice() {
                        console.log('Price form jsp');
                        var name = document.getElementById('price');
                        var nameValue = name.value;
                        var priceError = document.getElementById("priceError");

                        var pattern = /^[0-9]+$/;

                        if (nameValue === "") {
                            priceError.innerHTML = "Price cannot be empty!";
                            priceError.style.color = "red";
                            return;
                        }

                        if (!pattern.test(nameValue)) {
                            priceError.innerHTML = "Invalid Price! Only Contain Numbers";
                            priceError.style.color = "red";
                            return;
                        }

                        var priceNumber = parseInt(nameValue, 10);
                        if (priceNumber < 50000 || priceNumber > 400000) {
                            priceError.innerHTML = "Invalid Price! Price must be upto 50,000";
                            priceError.style.color = "red";
                            return;
                        }

                        var xhttp = new XMLHttpRequest();
                        if (nameValue !== "") {
                            xhttp.open("GET", "http://localhost:2004/Osama_Bike_Showroom/price/" + nameValue);
                            xhttp.send();

                            xhttp.onload = function () {
                                console.log(this.responseText)
                                document.getElementById("priceError").innerHTML = this.responseText;
                            }
                        }
                    }
    </script>
</body>

</html>
