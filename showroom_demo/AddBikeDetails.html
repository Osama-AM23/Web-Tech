<%@ page isELIgnored="false" %>
    <%@ taglib prefix="c" uri="http://java.sun.com/jsp/jstl/core" %>
        <!DOCTYPE html>
        <html lang="en">

        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Add Bike</title>
            <link rel="icon" href="https://cdn.olaelectric.com/ev-discovery-platform/New-Homepage/ola_black_logo.svg"
                type="image/png" />

            <style>
                :root {
                    --main-color: #5c899d;
                    --bg-color: #fffcef;
                    --text-color: #2e4a56;
                    --input-bg: #ffffff;
                    --shadow-color: rgba(0, 0, 0, 0.2);
                }

                body {
                    margin: 0;
                    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                    background: var(--bg-color);
                    color: var(--text-color);
                    text-align: center;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    height: 100vh;
                    flex-direction: column;
                    padding: 20px;
                    overflow-y: auto;
                }


                header {
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    background: var(--main-color);
                    padding: 15px;
                    width: 100%;
                    position: fixed;
                    top: 0;
                    left: 0;
                    z-index: 1000;
                }

                header img {
                    height: 40px;
                }

                .container {
                    max-height: 54vh;
                    padding: 30px;
                }

                .container h3 {
                    color: white;
                    font-size: 22px;
                    margin-bottom: 15px;
                    text-align: center;
                    width: 100%;
                }

                .container select,
                .container input {
                    width: 100%;
                    height: 50px;
                    padding: 12px;
                    margin: 10px 0;
                    border: none;
                    border-radius: 10px;
                    background: var(--input-bg);
                    color: var(--text-color);
                    font-size: 16px;
                    outline: none;
                    transition: all 0.3s ease-in-out;
                    box-sizing: border-box;
                    box-shadow: 0 2px 5px var(--shadow-color);
                }

                .container select:hover,
                .container input:hover {
                    transform: scale(1.0);
                    box-shadow: 0 4px 8px var(--shadow-color);
                }

                .container select:focus,
                .container input:focus {
                    background: var(--bg-color);
                    border: 2px solid var(--text-color);
                }

                .file-upload {
                    width: 100%;
                    background: var(--input-bg);
                    padding: 12px;
                    margin: 10px 0;
                    border-radius: 10px;
                    text-align: center;
                    cursor: pointer;
                    font-size: 16px;
                    font-weight: bold;
                    box-shadow: 0 2px 5px var(--shadow-color);
                    transition: all 0.3s;
                }

                .file-upload:hover {
                    box-shadow: 0 4px 8px var(--shadow-color);
                    transform: scale(1.0);
                }

                .container input[type="submit"] {
                    background: var(--bg-color);
                    color: var(--text-color);
                    font-size: 18px;
                    font-weight: bold;
                    cursor: pointer;
                    transition: all 0.3s ease-in-out;
                    width: 100%;
                    box-shadow: 0 3px 10px var(--shadow-color);
                    height: 50px;
                    margin-top: 15px;
                    border-radius: 10px;
                    border: none;
                }

                .container input[type="submit"]:hover {
                    box-shadow: 0 5px 15px var(--shadow-color);
                    transform: scale(1.0);
                    background: var(--text-color);
                    color: white;
                }

                #fileError,
                #priceError {
                    color: red;
                    font-size: 13px;
                    font-weight: bold;
                    display: block;
                    margin-top: 5px;
                    text-align: left;
                    width: 100%;
                }

                @media (max-width: 500px) {
                    .container {
                        width: 95%;
                        padding: 25px;
                    }

                    header img {
                        height: 35px;
                    }

                    .container h3 {
                        font-size: 20px;
                    }

                    .container select,
                    .container input {
                        height: 45px;
                        font-size: 15px;
                    }

                    .container input[type="submit"] {
                        height: 48px;
                    }
                }
            </style>
        </head>

        <body>
            <header>
                <img src="https://cdn.olaelectric.com/ev-discovery-platform/New-Homepage/ola_black_logo.svg"
                    alt="OLA Electric">
            </header>

            <div class="container">
                <form id="bikeForm" action="addBikeDetails" method="post" enctype="multipart/form-data">
                    <h3>ADD Bike Details</h3>

                    <select name="bikeName">
                        <option value="" disabled selected>Select Bike</option>
                        <c:forEach items="${bike}" var="bike">
                            <option value="${bike.name()}">${bike.name()}</option>
                        </c:forEach>
                    </select>

                    <select name="version">
                        <option value="" disabled selected>Select Version</option>
                        <c:forEach items="${version}" var="version">
                            <option value="${version.name()}">${version.name()}</option>
                        </c:forEach>
                    </select>

                    <select name="bikeRange">
                        <option value="" disabled selected>Select Range</option>
                        <c:forEach items="${range}" var="range">
                            <option value="${range.name()}">${range.name()}</option>
                        </c:forEach>
                    </select>

                    <select name="motorPower">
                        <option value="" disabled selected>Select Motor Power</option>
                        <c:forEach items="${motorPower}" var="motorPower">
                            <option value="${motorPower.name()}">${motorPower.name()}</option>
                        </c:forEach>
                    </select>

                    <input type="text" onchange="onPrice()" id="price" name="price" placeholder="Enter Bike Price" />
                    <span id="priceError"></span>

                    <label>
                        <input type="file" name="files" id="imgProperty" accept=".jpg, .jpeg, .png">
                        <input type="file" name="files" id="imgProperty" accept=".jpg, .jpeg, .png">
                        <input type="file" name="files" id="imgProperty" accept=".jpg, .jpeg, .png">
                        <input type="file" name="files" id="imgProperty" accept=".jpg, .jpeg, .png">
                        <input type="file" name="files" id="imgProperty" accept=".jpg, .jpeg, .png">
                    </label>

                    <p id="fileError"></p>
                    <input type="submit" id="submitBtn" value="Register Details">
                </form>
            </div>

            <script>
                function onPrice() {
                    let price = document.getElementById('price').value;
                    let priceError = document.getElementById("priceError");

                    let pattern = /^[0-9]+$/;
                    if (!price.match(pattern) || price < 50000 || price > 400000) {
                        priceError.innerHTML = "Price must be between 50,000 and 400,000!";
                        return;
                    }

                    priceError.innerHTML = "";
                }
            </script>
        </body>

        </html>
