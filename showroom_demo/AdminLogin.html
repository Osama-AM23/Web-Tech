<%@ page isELIgnored="false" %>
    <%@ taglib prefix="c" uri="http://java.sun.com/jsp/jstl/core" %>
        <!DOCTYPE html>
        <html lang="en">

        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Admin Login</title>
            <link rel="icon" href="https://cdn.olaelectric.com/ev-discovery-platform/New-Homepage/ola_black_logo.svg"
                type="image/png" />
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

            <style>
                :root {
                    --main-color: #5c899d;
                    --bg-color: #fffcef;
                    --text-color: #2e4a56;
                    --button-hover: #fff9e0;
                }

                body {
                    margin: 0;
                    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                    background: var(--bg-color);
                    color: var(--text-color);
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    height: 100vh;
                    flex-direction: column;
                    text-align: center;
                }

                header {
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    background: var(--main-color);
                    padding: 8px 15px;
                    width: 100%;
                    position: fixed;
                    top: 0;
                    left: 0;
                }

                header img {
                    height: 35px;
                    width: auto;
                }

                .container {
                    background: var(--main-color);
                    padding: 20px;
                    border-radius: 10px;
                    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
                    width: 320px;
                }

                .container h3 {
                    color: white;
                    margin-bottom: 15px;
                }

                .input-container {
                    position: relative;
                    display: flex;
                    align-items: center;
                    margin-bottom: 15px;
                }

                .container input {
                    width: calc(100% - 20px);
                    padding: 10px;
                    border: none;
                    border-radius: 5px;
                    background: white;
                    color: var(--text-color);
                    font-size: 16px;
                    outline: none;
                    transition: background 0.3s ease-in-out;
                    display: block;
                }

                .send-otp-btn {
                    position: absolute;
                    right: 10px;
                    background: none;
                    border: none;
                    cursor: pointer;
                    font-size: 18px;
                    color: var(--main-color);
                }

                .send-otp-btn:hover {
                    transform: scale(1.1);
                }

                .container form {
                    display: flex;
                    flex-direction: column;
                    gap: 10px;
                }

                .container .login-btn {
                    background: white;
                    color: var(--main-color);
                    font-weight: bold;
                    cursor: pointer;
                    margin-bottom: 30px;
                    transition: 0.3s;
                    padding: 8px 15px;
                    font-size: 16px;
                    border-radius: 3px;
                    border: none;
                }

                .container .login-btn:hover {
                    background: var(--button-hover);
                    color: var(--text-color);
                    box-shadow: 0 0 10px var(--button-hover);
                    transform: scale(1.05);
                }

                .container .re-send-btn {
                    background: white;
                    color: var(--main-color);
                    font-weight: bold;
                    cursor: pointer;
                    transition: 0.3s;
                    padding: 4px 10px;
                    font-size: 12px;
                    border-radius: 5px;
                    border: none;
                    text-align: center;
                }

                .container .re-send-btn:hover {
                    background: var(--button-hover);
                    color: var(--text-color) box-shadow 0 0 6px var(--button-hover);
                }
            </style>
        </head>

        <body>
            <header>
                <img src="https://cdn.olaelectric.com/ev-discovery-platform/New-Homepage/ola_black_logo.svg"
                    alt="OLA Electric">
            </header>

            <div class="container">
                <form action="adminLogin" method="post">
                    <h3>SHOWROOM ADMIN</h3>
                    <div class="input-container">
                        <input type="text" id="email" name="email" placeholder="Enter Admin Email Id"
                            value="${email}" />
                        <button type="submit" class="send-otp-btn"><i
                                class="bi bi-arrow-right-circle-fill"></i></button>
                    </div>
                </form>

                <form action="verifyOtp" method="post" id="otpForm">
                    <input type="hidden" name="email" value="${email}" />
                    <div style="position: relative; display: inline-block;">
                        <input type="password" id="otp" name="otp" placeholder="Enter OTP"
                            style="padding-right: 30px;" />
                        <i class="bi bi-eye-slash" id="toggleOtp"
                            style="position: absolute; right: 30px; top: 50%; transform: translateY(-50%); cursor: pointer;"></i>
                    </div>

                    <div>Time left = <span id="timer"></span></div>
                    <c:if test="${not empty error}">
                        <p style="color: red;">${error}</p>
                    </c:if>
                    <input type="submit" class="login-btn" value="Login">
                </form>

                <form action="resendOtp" method="post">
                    <input type="hidden" name="email" value="${email}" />
                    <input type="submit" class="re-send-btn" value="Resend OTP">
                </form>
            </div>
            <script>
                let timerOn = true;

                function startTimer(duration) {
                    let remaining = duration;
                    function updateTimer() {
                        let m = Math.floor(remaining / 60);
                        let s = remaining % 60;

                        m = m < 10 ? '0' + m : m;
                        s = s < 10 ? '0' + s : s;
                        document.getElementById('timer').innerText = m + ':' + s;
                        remaining--;

                        if (remaining >= 0 && timerOn) {
                            setTimeout(updateTimer, 1000);
                        } else {
                            document.getElementById("otp").disabled = true;
                            document.getElementById("submitBtn").disabled = true;
                            alert("OTP expired! Please request a new one.");
                        }
                    }
                    updateTimer();
                }

                // Start timer when OTP is sent
                startTimer(120); // 2 minutes
            </script>
            
            <script>
                document.getElementById("toggleOtp").addEventListener("click", function () {
                    const otpInput = document.getElementById("otp");
                    if (otpInput.type === "password") {
                        otpInput.type = "text";
                        this.classList.remove("bi-eye-slash");
                        this.classList.add("bi-eye"); 
                    } else {
                        otpInput.type = "password";
                        this.classList.remove("bi-eye");
                        this.classList.add("bi-eye-slash"); 
                    }
                });
            </script>
        </body>

        </html>
