<%@ taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Bikes</title>
    <style>
        :root {
            --main-color: #5c899d;
            --bg-color: #fffcef;
            --text-color: #2e4a56;
            --accent-color: #4c7484;
            --container-bg: #ffffff;
            --h2-bg: #5c899d;
            --h2-text: white;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--main-color);
            padding: 10px 20px;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
        }

        header img {
            height: 35px;
            width: auto;
        }

        .container {
            width: 40%;
            background: var(--container-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 10px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            transform: translateY(0);
            transition: transform 0.3s ease-in-out;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h2 {
            background: var(--h2-bg);
            color: var(--h2-text);
            padding: 12px;
            border-radius: 8px;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--main-color);
            border-radius: 6px;
            background: #f9f9f9;
            transition: all 0.3s ease-in-out;
        }

        select:hover {
            background: #eef4f5;
        }

        button {
            padding: 12px 20px;
            background: var(--main-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 16px;
            transition: all 0.3s ease-in-out;
        }

        button:hover {
            background: var(--accent-color);
            transform: scale(1.05);
        }

        label {
            font-weight: 600;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <img src="https://cdn.olaelectric.com/ev-discovery-platform/New-Homepage/ola_black_logo.svg" alt="OLA Electric">
    </header>

    <div class="container">
        <h2>Assign Bikes to Showroom</h2>

        <form action="assignBikes" method="post">
            <label>Showroom Name: ${showroom.showroomName}</label><br>
            <label>Address: ${showroom.address}</label><br><br>
        
            <label>Select Bikes (Max 5):</label><br>
            
            <c:forEach items="${bikeNames}" var="bike">
                <input type="checkbox" name="bikeNames" value="${bike}" class="bike-checkbox">
                <label>${bike}</label><br>
            </c:forEach>
        
            <br>
            <button type="submit" id="submit-btn" disabled>Assign Bikes</button>
        </form>
        
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                const checkboxes = document.querySelectorAll(".bike-checkbox");
                const submitButton = document.getElementById("submit-btn");
        
                checkboxes.forEach(checkbox => {
                    checkbox.addEventListener("change", function() {
                        let checkedCount = document.querySelectorAll(".bike-checkbox:checked").length;
                        submitButton.disabled = (checkedCount === 0 || checkedCount > 5); 
                    });
                });
            });
        </script>
        
    </div>

</body>
</html>
