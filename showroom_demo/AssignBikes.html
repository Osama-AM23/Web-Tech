<%@ page isELIgnored = "false"%>
<%@ taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Bikes</title>
    <link rel="icon" href="https://cdn.olaelectric.com/ev-discovery-platform/New-Homepage/ola_black_logo.svg"
            type="image/png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --main-color: #5c899d;
            --bg-color: #fffcef;
            --text-color: #2e4a56;
            --accent-color: #4c7484;
            --container-bg: #ffffff;
            --h2-bg: #5c899d;
            --h2-text: white;
            --success-color: #28a745;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--main-color);
            padding: 10px 20px;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
        }

        header img {
            height: 35px;
            width: auto;
        }

        .container {
            width: 85%;
            max-width: 350px;
            background: var(--container-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 10px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: 80px;
        }

        h2 {
            background: var(--h2-bg);
            color: var(--h2-text);
            padding: 12px;
            border-radius: 8px;
            width: 100%;
        }

        .checkbox-container {
            display: flex;
            flex-direction: column;
            align-items: start;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--main-color);
            max-height: 150px;
            overflow-y: auto;
            width: 100%;
            margin-top: 10px;
        }

        .bike-label i {
            display: none;
            color: var(--success-color);
            font-size: 18px;
            margin-left: 5px;
        }

        button {
            padding: 10px 18px;
            background: var(--main-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 16px;
            transition: all 0.3s ease-in-out;
            width: 100%;
        }

        button:hover {
            background: var(--accent-color);
            transform: scale(1.05);
        }

        @media (max-width: 500px) {
            .container {
                width: 90%;
                max-width: 320px;
                padding: 18px;
            }
        }
    </style>
</head>
<body>

    <header>
        <img src="https://cdn.olaelectric.com/ev-discovery-platform/New-Homepage/ola_black_logo.svg" alt="OLA Electric">
    </header>

    <div class="container">
            <h2>Assign Bikes to Showroom</h2>

            <form action="assignBikes" method="post">
                <label>Showroom Name: ${showroom.showroomName}</label><br>
                <label>Address: ${showroom.address}</label><br><br>

                <input type="hidden" name="address" value="${showroom.address}">
                <c:if test="${not empty error}">
                    <div class="error-message">${error}</div>
                </c:if>

                <label>Select Bikes (Max 5):</label>
                <div class="checkbox-container">
                    <c:forEach items="${bikeName}" var="bike">
                        <input type="checkbox" name="bikeNames" value="${bike}" class="bike-checkbox" id="bike-${bike}">
                        <label for="bike-${bike}" class="bike-label">
                            ${bike} <i class="bi bi-check-circle icon"></i>
                        </label><br>
                    </c:forEach>
                </div>
                 <p id="selected-count">Selected: 0/5</p>

                <br>
                <button type="submit" id="submit-btn" disabled>Assign Bikes</button>
            </form>

            <script>
                document.addEventListener("DOMContentLoaded", function() {
                    const checkboxes = document.querySelectorAll(".bike-checkbox");
                    const submitButton = document.getElementById("submit-btn");
                    const selectedCount = document.getElementById("selected-count");

                    function updateSelection() {
                        let checkedCount = 0;
                        checkboxes.forEach(checkbox => {
                            const icon = checkbox.nextElementSibling.querySelector(".icon");
                            if (checkbox.checked) {
                                checkedCount++;
                                icon.style.display = "inline-block";
                            } else {
                                icon.style.display = "none";
                            }
                        });
                        submitButton.disabled = (checkedCount === 0 || checkedCount > 5);
                        selectedCount.textContent = `Selected: ${checkedCount}/5`;
                    }

                    checkboxes.forEach(checkbox => {
                        checkbox.addEventListener("change", updateSelection);
                    });
                });
            </script>
        </div>
</body>
</html>
