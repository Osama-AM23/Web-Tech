<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add showroom</title>
    <link rel="icon" href="https://cdn.olaelectric.com/ev-discovery-platform/New-Homepage/ola_black_logo.svg"
        type="image/png" />

    <style>
        :root {
            --main-color: #5c899d;
            --bg-color: #fffcef;
            --text-color: #2e4a56;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--main-color);
            padding: 8px 15px;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        header img {
            height: 35px;
            width: auto;
        }

        .container {
            background: var(--main-color);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 300px;
        }

        .container h3 {
            color: white;
            margin-bottom: 15px;
        }

        .container input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: white;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
            transition: background 0.3s ease-in-out;
        }

        .container input::placeholder {
            color: var(--text-color);
            opacity: 0.8;
            font-size: 12px;
            font-style: italic;
        }

        .container input::placeholder {
            color: var(--text-color);
            opacity: 0.8;
        }

        .container input:focus {
            background: var(--bg-color);
        }

        .container input[type="submit"] {
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            width: 100%;
            box-shadow: 0 0 5px var(--bg-color);
        }

        .container input[type="submit"]:hover {
            box-shadow: 0 0 15px var(--bg-color);
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <header>
        <img src="https://cdn.olaelectric.com/ev-discovery-platform/New-Homepage/ola_black_logo.svg" alt="OLA Electric">
    </header>

    <div class="container">

        <h3>ADD SHOWROOM BRANCH</h3>
        <input type="text" id="showroomName" name="showroomName" placeholder="Enter Show Room Name" />
        <input type="text" id="location" name="location" placeholder="Enter location" />
        <input type="text" id="phoneNo" name="phoneNo" placeholder="Enter showroom contact" />
        <input type="submit" value="Register showroom">

    </div>

</body>

</html>
