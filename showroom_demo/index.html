<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLA Electric</title>
    <link rel="icon" href="https://cdn.olaelectric.com/ev-discovery-platform/New-Homepage/ola_black_logo.svg" type="image/png"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --main-color: #5c899d;
            --bg-color: #fffcef;
            --text-color: #2e4a56;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--main-color);
            padding: 8px 15px;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        header img {
            height: 35px;
            width: auto;
        }

        .menu-icon {
            font-size: 24px;
            color: white;
            cursor: pointer;
            margin-left: auto;
            margin-right: 40px; /* Adjusted to move slightly more to the right */
            position: relative;
        }

        .menu-icon:hover {
            color: var(--text-color);
        }

        .menu-icon::after {
            content: "Menu";
            position: absolute;
            top: -25px;
            right: 0;
            background: var(--main-color);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }


        .menu {
            display: none;
            flex-direction: column;
            position: absolute;
            top: 50px;
            right: 10%;
            transform: translateX(50%);
            background: var(--main-color);
            border-radius: 5px;
            padding: 8px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
            width: 150px;
            text-align: center;
        }

        .menu a {
            text-decoration: none;
            color: white;
            padding: 8px;
            display: block;
        }

        .menu a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .container {
            text-align: center;
            max-width: 500px;
            overflow: hidden;
            position: relative;
        }

        .slider {
            display: flex;
            width: 100%;
            transition: transform 1s ease-in-out;
        }

        .slider img {
            width: 100%;
            border-radius: 10px;
            flex-shrink: 0;
        }

        h2, h4 {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <img src="https://cdn.olaelectric.com/ev-discovery-platform/New-Homepage/ola_black_logo.svg" alt="OLA Electric">
        <i class="bi bi-list menu-icon" onclick="toggleMenu()"></i>
        <nav class="menu" id="menu">
            <a href="AdminLogin">ADMIN</a>
            <a href="UserLogin">USER</a>
        </nav>
    </header>
    
    <div class="container">
        <div class="slider" id="slider">
            <img src="https://i.pinimg.com/736x/ca/b3/38/cab338f6182bc0c24249b5bc0a9a9481.jpg" alt="OLA Electric">
            <img src="https://i.pinimg.com/736x/30/d9/29/30d929a96768ae700d20158d8b971468.jpg" alt="OLA Electric">
            <img src="https://i.pinimg.com/736x/ce/e0/a3/cee0a3af7a0c40317936fc910eff4474.jpg" alt="OLA Electric">
        </div>
        <h2>Welcome To OLA Electric</h2>
        <h4>Where Would You Like To Start?</h4>
    </div>

    <script>
        function toggleMenu() {
            var menu = document.getElementById('menu');
            if (menu.style.display === 'block') {
                menu.style.display = 'none';
            } else {
                menu.style.display = 'block';
            }
        }

        let index = 0;
        function slideImages() {
            const slider = document.getElementById("slider");
            index = (index + 1) % slider.children.length;
            slider.style.transform = `translateX(${-index * 100}%)`;
        }
        setInterval(slideImages, 3000);
    </script>
</body>
</html>
