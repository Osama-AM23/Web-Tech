<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLA Electric</title>
    <link rel="icon" href="https://cdn.olaelectric.com/ev-discovery-platform/New-Homepage/ola_black_logo.svg"
        type="image/png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --main-color: #5c899d;
            --bg-color: #ffffff;
            --text-color: #2e4a56;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--main-color);
            padding: 8px 15px;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        header img {
            height: 35px;
            width: auto;
        }

        .menu-icon {
            font-size: 24px;
            color: white;
            cursor: pointer;
            margin-left: auto;
            margin-right: 40px;
            position: relative;
        }

        .menu-icon:hover {
            color: var(--text-color);
        }

        .menu-icon::after {
            content: "Menu";
            position: absolute;
            top: -25px;
            right: 0;
            background: var(--main-color);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .menu {
            display: none;
            flex-direction: column;
            position: absolute;
            top: 50px;
            right: 10%;
            transform: translateX(50%);
            background: var(--main-color);
            border-radius: 5px;
            padding: 8px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
            width: 150px;
            text-align: center;
        }

        .menu a {
            text-decoration: none;
            color: white;
            padding: 8px;
            display: block;
        }

        .menu a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .container {
            text-align: center;
            max-width: 570px;
            overflow: hidden;
            position: relative;
        }

        h2,
        h4 {
            margin-top: 10px;
        }

        .content {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
            text-align: justify;
        }

        .bottom-right-img {
            position: fixed;
            bottom: 10px;
            right: 0px;
            width: 500px;
            height: auto;
        }
    </style>
</head>

<body>
    <header>
        <img src="https://cdn.olaelectric.com/ev-discovery-platform/New-Homepage/ola_black_logo.svg" alt="OLA Electric">
        <i class="bi bi-list menu-icon" onclick="toggleMenu()"></i>
        <nav class="menu" id="menu">
            <a href="adminLogin">ADMIN</a>
            <a href="UserLogin">USER</a>
        </nav>
    </header>

    <div class="container">
        <h2>Welcome To OLA Electric</h2>
        <h4>Where Would You Like To Start?</h4>
    </div>

    <img class="bottom-right-img" src="https://i.ibb.co/TMf6Mkrh/home-experience-center-bg-v2-Photoroom.png"
        alt="Experience Center">

    <script>
        function toggleMenu() {
            var menu = document.getElementById('menu');
            if (menu.style.display === 'block') {
                menu.style.display = 'none';
            } else {
                menu.style.display = 'block';
            }
        }

        let index = 0;
        function slideImages() {
            const slider = document.getElementById("slider");
            index = (index + 1) % slider.children.length;
            slider.style.transform = `translateX(${-index * 100}%)`;
        }
        setInterval(slideImages, 3000);
    </script>
</body>

</html>
